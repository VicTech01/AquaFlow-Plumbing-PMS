<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>AquaFlow PMS — Plumbing Contractor Management</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230ea5e9' d='M12 2s7 7.6 7 12a7 7 0 1 1-14 0c0-4.4 7-12 7-12z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2s7 7.6 7 12a7 7 0 1 1-14 0c0-4.4 7-12 7-12z"/></svg>
      </div>
      <div>
        <div class="logo-name">AquaFlow</div>
        <div class="logo-sub">Plumbing PMS</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="top-title" id="top-title">Dashboard</div>
      <div class="top-right row">
        <span class="top-date" id="top-date"></span>
        <button class="btn ghost sm" id="top-quick-quote">+ Quotation</button>
        <button class="btn primary sm" id="top-quick-job">+ New job</button>
        <button class="icon-btn" id="top-plus" title="New" aria-label="New">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<nav id="tabbar" aria-label="Primary"></nav>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="js/utils.js"></script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/leads.js"></script>
<script src="js/views/jobs.js"></script>
<script src="js/views/dispatch.js"></script>
<script src="js/views/customers.js"></script>
<script src="js/views/quotes.js"></script>
<script src="js/views/invoices.js"></script>
<script src="js/views/expenses.js"></script>
<script src="js/views/inventory.js"></script>
<script src="js/views/maintenance.js"></script>
<script src="js/views/whatsapp.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
